name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName\s*=\s*"([^"]+)"', Path('android/app/build.gradle.kts').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match versionName in android/app/build.gradle.kts'
          PY
      - name: Restore Flow signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOW_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing FLOW_DEBUG_KEYSTORE_BASE64 repository secret'; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/flow-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flow-signing/debug.keystore"
          chmod 600 "$RUNNER_TEMP/flow-signing/debug.keystore"
          echo "FLOW_SIGNING_STORE_FILE=$RUNNER_TEMP/flow-signing/debug.keystore" >> "$GITHUB_ENV"
      - name: Build APK, compile device tests and run lint
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest
      - name: Verify update-compatible signature
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/flow-certificate.txt"
          grep -iq '8ae89f2f6f1bd054f1b7c72400808f84d82de90defbfa76e076c5c96f365759c' "$RUNNER_TEMP/flow-certificate.txt"
      - name: Prepare download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Flow.apk
          cd dist
          sha256sum Flow.apk > Flow.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Flow-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/flow-signing/debug.keystore"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Flow-${{ github.sha }}
          path: dist
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check Flow.apk.sha256
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true || { echo 'A published release already exists; refusing to replace it.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Flow ${RELEASE_TAG#v} for Android" --generate-notes --notes 'Download Flow.apk below and install over the previous version. Android 8.0+. Development build. / Скачайте Flow.apk и установите поверх предыдущей версии. Android 8.0+. Сборка для разработки.'
          fi
          gh release upload "$RELEASE_TAG" Flow.apk Flow.apk.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
